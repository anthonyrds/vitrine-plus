name: Deploy Vitrine+ to IONOS

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le projet
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire le site
        run: npm run build

      - name: Installer le client SFTP
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Déployer sur IONOS via SFTP
        env:
          SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
        run: |
          lftp -u "su1574645,$SFTP_PASSWORD" sftp://access-5019473596.webspace-host.com:22 <<EOF
          set sftp:auto-confirm yes
          set net:timeout 30
          set net:max-retries 2
          set net:reconnect-interval-base 5
          cd /public
          mirror --reverse --delete --verbose dist/ .
          bye
          EOF
